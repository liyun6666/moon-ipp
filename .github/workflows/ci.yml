name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit stable
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          moon version --all
          moon update
      - name: Core and client checks
        run: |
          moon check --target wasm-gc --deny-warn
          moon test --target wasm-gc --deny-warn
          moon check --target js --deny-warn
          moon test --target js --deny-warn
          moon check --deny-warn
          moon test --deny-warn
          moon build --deny-warn
          moon fmt --check
          python3 scripts/count_source.py --minimum 4001
      - name: Install independent CUPS implementation
        run: |
          sudo apt-get update
          sudo apt-get install -y cups-ipp-utils avahi-daemon
          sudo systemctl start avahi-daemon
      - name: Exercise native client against CUPS
        run: python3 scripts/interop_cups.py
      - name: Exercise legal empty-final-document submission against CUPS
        run: moon run --deny-warn scripts/interop_boundaries.mbtx
      - name: Preserve interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cups-interoperability-evidence
          path: interop-output/
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit stable
        shell: pwsh
        run: |
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Resolve dependencies
        run: |
          moon version --all
          moon update
      - name: Check all supported backends and build with MSVC
        run: moon run scripts/verify.mbtx
